version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    environment:
      # Change NEO4J_AUTH before any non-local deployment (user/password).
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/test_change_me}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  qdrant_storage:
  neo4j_data:
